<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/side-nav.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/photo-dump.css">
    <link rel="stylesheet" href="./styles/things-i-like.css">
    <link rel="stylesheet" href="./styles/my-interest.css">
    <link rel="stylesheet" href="./styles/to-webtory.css">
    <link rel="stylesheet" href="./styles/footer.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header__left">
            <img class="header__avatar" src="./assets/images/avatar.webp" alt="">
        </div>
        <h1 class="header__title">효정's 블로그</h1>
        <nav class="header__right" aria-label="소셜 링크">
            <ul class="header__social">
                <li>
                    <a href="https://github.com/ahyohyo" target="_blank" rel="noopener noreferrer">
                        <img src="./assets/icons/github-logo-icon.svg" alt="깃허브 바로가기">
                    </a>
                </li>
                <li>
                    <a href="https://zzazani.tistory.com" target="_blank" rel="noopener noreferrer">
                        <img src="./assets/icons/tistory-logo-icon.svg" alt="티스토리 블로그 바로가기">
                    </a>
                </li>
            </ul>
        </nav>

                    <figure class="grid__item"><img src="./assets/images/buddys1.webp" alt="버디즈 데모데이 부스"></figure>

                    </div>
                    <div class="gini__list" aria-hidden="true">
                        <img src="./assets/images/gini/gini01.webp" alt="">

                    <article class="my-interest__card">

                            <div class="my-interest__actions">
                                <button type="button" class="my-interest__button my-interest__button--like">좋아요</button>
                                <button type="button" class="my-interest__button my-interest__button--dislike">싫어요</button>

        <p>자기소개 페이지 끝-!</p>
